<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Ôn thi Đại lý Bảo hiểm Nhân thọ</title>
<style>
  :root{
    --maroon:#C5281C;
    --maroon-dark:#8F1B12;
    --maroon-light:#E15243;
    --bg:#F5F5F5;
    --card:#FFFFFF;
    --ink:#1A1A1A;
    --ink-soft:#555555;
    --border:#E5E5E5;
    --success:#1E7A46;
    --success-bg:#E8F5EC;
    --danger:#B3261E;
    --danger-bg:#FCEBEA;
    --lock:#9E9E9E;
    --radius:16px;
    --shadow: 0 4px 18px rgba(139,30,30,0.08);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .app-bg{ position:fixed; inset:0; z-index:0; background-size:cover; background-position:center 20%; background-color:#8a1a12; }
  .app-bg-tint{ position:fixed; inset:0; z-index:1; background: linear-gradient(180deg, rgba(197,40,28,.42) 0%, rgba(197,40,28,.38) 45%, rgba(245,245,245,.94) 92%); }
  #app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    background: transparent;
    position:relative;
    z-index:2;
  }
  button{font-family:inherit;}

  /* ================= REGISTRATION ================= */
  .reg-page{ position:relative; min-height:100vh; overflow:hidden; }
  .reg-bg{
    position:fixed; inset:0; z-index:0;
    background-size:cover; background-position:center 20%;
    background-color:#8a1a12;
  }
  .reg-overlay{
    position:fixed; inset:0; z-index:1;
    background: linear-gradient(180deg, rgba(197,40,28,.42) 0%, rgba(197,40,28,.38) 45%, rgba(245,245,245,.97) 92%);
  }
  .reg-content{ position:relative; z-index:2; padding:38px 18px 30px; }
  .reg-hero{ text-align:center; color:#fff; margin-bottom:24px; padding-top:6px; }
  .reg-hero h1{ font-size:25px; font-weight:800; margin:0 0 8px; line-height:1.3; letter-spacing:.5px;
    text-shadow:0 2px 10px rgba(0,0,0,.45);}
  .reg-hero p{ font-size:14px; margin:0; font-style:italic; font-weight:600; text-shadow:0 2px 8px rgba(0,0,0,.45); }
  .reg-card{
    background:var(--card); border-radius:var(--radius); padding:24px 20px;
    box-shadow: 0 12px 32px rgba(0,0,0,.18);
  }
  .reg-title{ font-size:17px; font-weight:800; color:var(--maroon); margin:0 0 4px;}
  .reg-sub{ font-size:12.5px; color:var(--ink-soft); margin:0 0 18px; line-height:1.5;}
  .field{margin-bottom:16px;}
  .field label{display:block; font-size:13px; font-weight:600; margin-bottom:6px; color:var(--ink);}
  .field .hint{font-size:11.5px; color:var(--ink-soft); margin-top:4px;}
  input[type=text], select{
    width:100%; padding:12px 14px; border-radius:10px; border:1.5px solid var(--border);
    font-size:15px; background:#fff; color:var(--ink); font-family:inherit;
  }
  input:focus, select:focus{ outline:none; border-color:var(--maroon-light); }
  .dob-row{ display:grid; grid-template-columns: 1fr 1.3fr 1fr; gap:8px; }
  .dob-row select{ padding:12px 6px; font-size:13.5px; }
  .dob-preview{ font-size:12.5px; color:var(--maroon); font-weight:700; margin-top:6px; }
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    width:100%; padding:14px; border-radius:12px; border:none;
    background: var(--maroon); color:#fff; font-size:15px; font-weight:700;
    cursor:pointer; transition:transform .12s ease, background .15s ease, box-shadow .12s ease;
  }
  .btn:hover:not(:disabled){ transform: translateY(-2px) scale(1.02); box-shadow:0 6px 16px rgba(139,30,30,.22); }
  .btn:active{ transform:scale(.98); }
  .btn:disabled{ background:#CFCFCF; cursor:not-allowed; }
  .btn.secondary{ background:#fff; color:var(--maroon); border:1.5px solid var(--maroon); }
  .btn.danger-outline{ background:#fff; color:var(--danger); border:1.5px solid var(--danger); }
  .error-msg{ color:var(--danger); font-size:12.5px; margin-top:6px; display:none;}

  /* ================= MAIN HEADER / TABS ================= */
  .topbar{
    background: linear-gradient(rgba(197,40,28,.55), rgba(197,40,28,.55)),
      url('https://images.unsplash.com/photo-1758518731468-98e90ffd7430?fm=jpg&q=70&w=1200&auto=format&fit=crop&ixlib=rb-4.1.0') center 20%/cover;
    background-color: var(--maroon);
    color:#fff;
    padding:16px 18px 14px;
    position:sticky; top:0; z-index:20;
    box-shadow: var(--shadow);
  }
  .topbar-toprow{ display:flex; align-items:flex-start; justify-content:space-between; gap:14px; }
  .topbar-profile{ min-width:0; flex:1; }
  .student-name{ font-size:19px; font-weight:800; line-height:1.25; }
  .app-title{ font-size:11.5px; opacity:.78; margin-top:3px; font-weight:600; letter-spacing:.3px;}
  .export-btn{ background:rgba(255,255,255,.16); border:none; color:#fff; width:34px; height:34px; border-radius:50%;
    font-size:15px; cursor:pointer; flex-shrink:0; }
  .logout-btn{
    background: var(--maroon-dark); border:none; color:#fff;
    padding:10px 20px; border-radius:16px; font-size:12.5px; font-weight:800;
    cursor:pointer; flex-shrink:0; letter-spacing:.4px;
    box-shadow: 0 3px 0 #5c0f09, 0 5px 10px rgba(0,0,0,.28);
    transition: transform .08s ease, box-shadow .08s ease;
  }
  .logout-btn:hover{ transform: translateY(-2px) scale(1.02); }
  .logout-btn:active{ transform: translateY(2px); box-shadow: 0 1px 0 #5c0f09, 0 2px 5px rgba(0,0,0,.22); }
  .tabbar{ display:flex; gap:6px; margin-top:14px; }
  .tab{ flex:1; text-align:center; padding:10px 4px; font-size:13px; font-weight:700;
    color:rgba(255,255,255,.7); border-bottom:3px solid transparent; cursor:pointer;
    transition: transform .15s ease, color .15s ease; }
  .tab:hover{ transform: translateY(-2px) scale(1.02); color:rgba(255,255,255,.9); }
  .tab.active{ color:#fff; border-bottom-color:#fff; }

  .screen{ padding:16px 18px 90px; animation: fadeIn .25s ease; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

  .stat-strip{ display:flex; gap:6px; }
  .stat-chip{ flex:1; background:var(--card); border-radius:10px; padding:7px 4px; text-align:center; box-shadow:var(--shadow); }
  .stat-chip .n{ font-size:13.5px; font-weight:800; color:var(--maroon); }
  .stat-chip .l{ font-size:9px; color:var(--ink-soft); margin-top:1px; }

  .section-title{ font-size:12.5px; font-weight:700; color:var(--maroon); text-transform:uppercase;
    letter-spacing:.5px; margin:4px 0 10px 2px;}

  /* ================= ITEM CARDS (chủ đề / đề thi thử) ================= */
  .topic-card{
    background:var(--card); border-radius:14px; padding:14px 16px; margin-bottom:11px;
    box-shadow:var(--shadow); display:flex; align-items:center; gap:13px; cursor:pointer;
    border:1.5px solid transparent; position:relative;
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .topic-card:not(.locked):not(.empty):hover{ transform: translateY(-2px) scale(1.02); box-shadow: 0 8px 22px rgba(139,30,30,.16); }
  .topic-card.locked, .topic-card.empty{ opacity:.55; cursor:not-allowed; }
  .topic-card.passed{ border-color:var(--success); }
  .topic-medal{ position:absolute; top:-6px; right:-6px; font-size:18px; filter:drop-shadow(0 2px 3px rgba(0,0,0,.25)); }
  .topic-badge{
    width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:14px; flex-shrink:0; color:#fff; background:var(--maroon);
  }
  .topic-card.locked .topic-badge, .topic-card.empty .topic-badge{ background:var(--lock); }
  .topic-card.passed .topic-badge{ background:var(--success); }
  .topic-info{flex:1; min-width:0;}
  .topic-info .name{ font-size:14px; font-weight:700; margin:0 0 4px; text-transform:uppercase; letter-spacing:.2px; }
  .topic-info .meta1{ font-size:11.5px; color:var(--ink-soft); margin-bottom:3px;}
  .topic-info .meta2{ display:flex; flex-wrap:wrap; gap:4px 10px; font-size:11px; color:var(--ink-soft); }
  .topic-info .meta2 b{ color:var(--ink); }
  .topic-status{ font-size:17px; flex-shrink:0; }


  /* ================= QUIZ TAKING (swipe) ================= */
  .quiz-page{ position:fixed; inset:0; z-index:50; background:var(--bg); display:flex; flex-direction:column; }
  .quiz-header{ background:var(--maroon); color:#fff; padding:14px 14px; flex-shrink:0; }
  .quiz-header-row{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .exit-btn{
    background: var(--maroon-dark); border:none; color:#fff;
    padding:9px 16px; border-radius:14px; font-size:12px; font-weight:800;
    cursor:pointer; flex-shrink:0; letter-spacing:.4px;
    box-shadow: 0 3px 0 #5c0f09, 0 5px 9px rgba(0,0,0,.28);
    transition: transform .08s ease, box-shadow .08s ease;
  }
  .exit-btn:hover{ transform: translateY(-2px) scale(1.02); }
  .exit-btn:active{ transform: translateY(2px); box-shadow: 0 1px 0 #5c0f09, 0 2px 4px rgba(0,0,0,.22); }
  .quiz-title{ font-size:14.5px; font-weight:800; flex:1; text-align:center; padding:0 6px;
    text-transform:uppercase; letter-spacing:.3px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .timer{ font-weight:800; font-size:18px; background:rgba(255,255,255,.18); padding:8px 15px; border-radius:14px; flex-shrink:0;}
  .quiz-progress-track{ height:5px; background:rgba(255,255,255,.25); border-radius:6px; margin-top:12px; overflow:hidden;}
  .quiz-progress-fill{ height:100%; background:#fff; border-radius:6px; transition:width .2s ease;}

  .quiz-scroll{ flex:1; overflow-y:auto; scroll-snap-type:y mandatory; -webkit-overflow-scrolling:touch; }
  .qslide{ scroll-snap-align:start; min-height:100%; display:flex; flex-direction:column; justify-content:center;
    padding:22px 20px 30px; }
  .qslide .qnum{ font-size:12px; font-weight:700; color:var(--maroon-light); margin-bottom:8px;}
  .qcard{ background:var(--card); border-radius:var(--radius); padding:20px; box-shadow:var(--shadow); }
  .qtext{ font-size:16px; font-weight:700; line-height:1.5; margin:0 0 18px;}
  .opt{
    display:flex; align-items:flex-start; gap:12px; padding:13px 14px; border:1.5px solid var(--border);
    border-radius:12px; margin-bottom:10px; cursor:pointer; font-size:14.5px; line-height:1.5;
  }
  .opt.selected{ border-color:var(--maroon-light); background:#FDF1EF; }
  .opt .dot{ width:20px; height:20px; border-radius:50%; border:2px solid var(--border); flex-shrink:0; margin-top:1px;
    display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; color:#fff;}
  .opt.selected .dot{ border-color:var(--maroon-light); background:var(--maroon-light); }
  .opt.correct{ border-color:var(--success); background:var(--success-bg); }
  .opt.correct .dot{ border-color:var(--success); background:var(--success); }
  .opt.incorrect{ border-color:var(--danger); background:var(--danger-bg); }
  .opt.incorrect .dot{ border-color:var(--danger); background:var(--danger); }
  .opt.review-opt{ cursor:default; padding:10px 12px; font-size:13.5px; margin-bottom:7px; }
  .opt.review-opt .dot{ width:18px; height:18px; font-size:10px; }
  .swipe-hint{ text-align:center; font-size:11.5px; color:var(--ink-soft); margin-top:14px; }

  .submit-slide{ align-items:center; text-align:center; }
  .submit-slide .icon{ font-size:44px; margin-bottom:10px; }
  .submit-slide h3{ font-size:17px; margin:0 0 6px; }
  .submit-slide p{ font-size:13px; color:var(--ink-soft); margin:0 0 20px; }

  .quiz-footer{ flex-shrink:0; background:#fff; border-top:1px solid var(--border); padding:10px 16px;
    display:flex; align-items:center; gap:12px; }
  .answered-count{ font-size:12px; color:var(--ink-soft); font-weight:600; white-space:nowrap; }
  .quiz-footer .btn{ padding:11px; font-size:14px; }

  /* ================= MODAL ================= */
  .modal-backdrop{ position:fixed; inset:0; background:rgba(20,8,8,.55); z-index:200; display:flex;
    align-items:center; justify-content:center; padding:24px; animation: fadeIn .15s ease;}
  .modal-box{ background:#fff; border-radius:16px; padding:22px 20px; max-width:340px; width:100%; text-align:center;}
  .modal-box .micon{ font-size:34px; margin-bottom:8px;}
  .modal-box h3{ font-size:16.5px; margin:0 0 8px;}
  .modal-box p{ font-size:13px; color:var(--ink-soft); margin:0 0 20px; line-height:1.5;}
  .modal-actions{ display:flex; gap:10px; }
  .modal-actions .btn{ flex:1; }

  /* ================= RESULT ================= */
  .result-hero{ text-align:center; padding:26px 10px 6px;}
  .result-item-name{ font-size:18px; font-weight:800; color:var(--maroon); text-transform:uppercase;
    letter-spacing:.3px; margin:0 0 18px; line-height:1.35; }
  .result-ring{ width:112px; height:112px; border-radius:50%; margin:0 auto 14px; display:flex; align-items:center;
    justify-content:center; font-size:26px; font-weight:800; color:#fff; }
  .result-ring.pass{ background: conic-gradient(var(--success) 0deg, var(--success) calc(var(--pct)*3.6deg), #ddd calc(var(--pct)*3.6deg)); }
  .result-ring.fail{ background: conic-gradient(var(--danger) 0deg, var(--danger) calc(var(--pct)*3.6deg), #ddd calc(var(--pct)*3.6deg)); }
  .result-ring .inner{ width:90px; height:90px; border-radius:50%; background:#fff; display:flex; align-items:center;
    justify-content:center; color:var(--ink); }
  .result-title{ font-size:18px; font-weight:800; margin:6px 0 2px;}
  .result-sub{ font-size:13px; color:var(--ink-soft); margin-bottom:18px; }
  .review-item{ background:var(--card); border-radius:12px; padding:14px; margin-bottom:10px; box-shadow:var(--shadow);}
  .review-q{ font-size:13.5px; font-weight:700; margin:0 0 8px;}
  .review-tag{ display:inline-block; font-size:11px; font-weight:800; padding:2px 8px; border-radius:20px; margin-bottom:8px;}
  .review-tag.ok{ background:var(--success-bg); color:var(--success); }
  .review-tag.bad{ background:var(--danger-bg); color:var(--danger); }
  .explain-box{ margin-top:10px; background:var(--bg); border-left:4px solid var(--maroon); padding:10px 12px;
    border-radius:8px; font-size:12.5px; line-height:1.6; color:var(--ink);}
  .explain-box b{ color:var(--maroon); }

  .warn-banner{
    position:fixed; top:0; left:0; right:0; z-index:999; background:var(--danger); color:#fff;
    text-align:center; font-size:13px; font-weight:700; padding:10px 16px;
    animation: slideDown .25s ease;
  }
  @keyframes slideDown{ from{transform:translateY(-100%);} to{transform:translateY(0);} }
  .empty{ text-align:center; padding:40px 20px; color:var(--ink-soft); font-size:13.5px;}

  /* ================= BADGE LINE IN HEADER ================= */
  .badge-line{ font-size:12px; opacity:.92; margin-top:2px; font-weight:600; word-break:keep-all; overflow-wrap:break-word; }
  .icon-gold{ display:inline-block; filter: sepia(1) saturate(7) hue-rotate(-12deg) brightness(1.2) contrast(1.05); }

  /* ================= ACHIEVEMENT / WELCOME POPUP ================= */
  .achv-box{
    background: linear-gradient(160deg, #FFFFFF 0%, #F5F5F5 100%);
    border-radius:24px; padding:30px 22px 24px; max-width:360px; width:100%;
    text-align:center; box-shadow:0 24px 60px rgba(0,0,0,.35); position:relative; overflow:hidden;
    animation: popIn .35s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes popIn{ from{opacity:0; transform:scale(.8);} to{opacity:1; transform:scale(1);} }
  .achv-confetti{ position:absolute; inset:0; pointer-events:none; z-index:0; }
  .achv-content{ position:relative; z-index:1; }
  .achv-icon{ font-size:52px; margin-bottom:8px; }
  .achv-title{ font-size:19px; font-weight:800; color:var(--maroon); margin:0 0 10px; line-height:1.35; word-break:keep-all; overflow-wrap:break-word; }
  .achv-quote{ font-size:13.5px; font-style:italic; color:var(--ink-soft); margin:0 0 12px; line-height:1.6; word-break:keep-all; overflow-wrap:break-word; }
  .achv-message{ font-size:13.5px; font-weight:700; color:var(--maroon-dark); margin:0 0 20px; line-height:1.55; word-break:keep-all; overflow-wrap:break-word; }
  .welcome-greet{ font-size:17px; font-weight:600; color:var(--maroon); margin:0 0 6px; line-height:1.4; word-break:keep-all; overflow-wrap:break-word; }
  .welcome-name{ font-size:19px; font-weight:800; color:var(--maroon); margin:0 0 14px; line-height:1.35; word-break:keep-all; overflow-wrap:break-word; }
  .welcome-sub{ font-size:13.5px; font-weight:400; color:var(--ink-soft); margin:0; line-height:1.5; word-break:keep-all; overflow-wrap:break-word; }

  /* ================= JOURNEY PATH (bản đồ hành trình) ================= */
  .journey-wrap{ position:relative; padding:6px 4px 10px; }
  .journey-line{ position:absolute; left:29px; top:20px; bottom:20px; width:4px;
    background:linear-gradient(180deg, var(--border), var(--border)); border-radius:4px; z-index:0; }
  .journey-node{ position:relative; z-index:1; display:flex; align-items:flex-start; gap:14px; margin-bottom:14px; }
  .journey-dot{
    width:58px; height:58px; border-radius:50%; background:var(--maroon); color:#fff;
    display:flex; align-items:center; justify-content:center; font-weight:800; font-size:18px;
    flex-shrink:0; box-shadow:0 4px 10px rgba(0,0,0,.2); border:4px solid #fff; position:relative;
  }
  .journey-node.locked .journey-dot{ background:var(--lock); }
  .journey-node.passed .journey-dot{ background:var(--success); }
  .journey-node.empty .journey-dot{ background:var(--lock); opacity:.7; }
  .journey-medal{ position:absolute; top:-8px; right:-8px; font-size:18px; filter:drop-shadow(0 2px 3px rgba(0,0,0,.25)); }
  .journey-card{ flex:1; min-width:0; }

  /* ================= STREAK CHIP ================= */
  .streak-chip{ display:inline-flex; align-items:center; gap:5px; background:#FBEAE8; color:var(--maroon-dark);
    font-weight:800; font-size:11.5px; padding:6px 12px; border-radius:20px; margin-bottom:14px; }

  /* ================= CLOUD SAVED NOTE ================= */
  .cloud-note{ text-align:center; font-size:11px; color:var(--ink-soft); margin-top:16px; opacity:.8; }

  /* ================= RESULT SCREEN EXTRA INFO ================= */
  .result-extra{ font-size:12.5px; color:var(--ink-soft); margin-top:8px; line-height:1.8; }
  .result-extra b{ color:var(--ink); }
  .result-grade{ display:inline-block; font-size:12px; font-weight:800; padding:4px 14px; border-radius:20px;
    margin-top:8px; letter-spacing:.5px; }
  .result-grade.excellent{ background:#E7F6EC; color:#1E7A46; }
  .result-grade.pass{ background:var(--success-bg); color:var(--success); }
  .result-grade.fail{ background:var(--danger-bg); color:var(--danger); }

  /* ================= SCREEN TRANSITIONS ================= */
  .screen{ padding:16px 18px 90px; animation: screenEnter .3s cubic-bezier(.22,1,.36,1); }
  @keyframes screenEnter{ from{opacity:0; transform:translateY(14px) scale(.99);} to{opacity:1; transform:translateY(0) scale(1);} }
  .quiz-page{ animation: screenEnter .25s ease; }

  /* ================= MINI CONFETTI (topic pass) ================= */
  .mini-confetti-canvas{ position:fixed; inset:0; pointer-events:none; z-index:150; }

  /* ================= POST-LOGIN UTILITY ACTIONS ================= */
  .utility-actions{
    display:flex; align-items:flex-start; justify-content:flex-end; gap:10px;
    margin-top:0; flex-shrink:0; flex-wrap:wrap;
  }
  .utility-btn{
    border:1px solid rgba(139,30,30,.22);
    background:linear-gradient(135deg,#C5281C 0%,#D83245 52%,#E64A62 100%);
    color:#E9E9E9;
    border-radius:999px; padding:8px 13.5px; font-size:13px; font-weight:400;
    cursor:pointer; box-shadow:0 4px 11px rgba(139,30,30,.20);
    transition:transform .18s ease, box-shadow .18s ease, filter .18s ease;
    white-space:nowrap;
  }
  .utility-btn:hover{ transform:translateY(-2px); box-shadow:0 7px 15px rgba(139,30,30,.26); filter:saturate(1.08) brightness(1.03); }
  .utility-btn:active{ transform:translateY(0); }
  .utility-page{ min-height:100vh; padding:16px 18px 90px; animation:screenEnter .3s cubic-bezier(.22,1,.36,1); }
  .utility-page-head{ display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .utility-back{ width:38px; height:38px; border:0; border-radius:50%; background:var(--maroon); color:#fff; font-size:20px; cursor:pointer; }
  .utility-title{ font-size:19px; font-weight:900; color:var(--maroon); }
  .utility-subtitle{ font-size:12px; color:var(--ink-soft); margin-top:2px; }
  .pdf-shell{ background:#fff; border:1px solid var(--border); border-radius:14px; overflow:hidden; box-shadow:var(--shadow); height:calc(100vh - 150px); min-height:520px; }
  .pdf-shell iframe{ width:100%; height:100%; border:0; display:block; background:#fff; }

function getPassedTopicsCount(){
  const progress = getProgress();
  return TOPICS_DATA.filter(t => progress[t.id] && progress[t.id].status === "passed").length;
}
function getPassedMocksCount(){
  const mp = getMockProgress();
  return MOCKS_DATA.filter(m => mp[m.id] && (mp[m.id].bestScore||0) >= PASS_THRESHOLD).length;
}
function computeBadgeTierIndex(){
  const topicsPassed = getPassedTopicsCount();
  const mocksPassed = getPassedMocksCount();
  if(topicsPassed >= 10 && mocksPassed >= 10) return 5; // legend
  if(topicsPassed >= 10 && mocksPassed >= 5) return 4;  // captain
  if(topicsPassed >= 7) return 3;                        // champion (7-10, chưa đủ điều kiện captain)
  if(topicsPassed >= 4) return 2;                        // lion
  if(topicsPassed >= 1) return 1;                        // cub
  return 0;                                              // soldier (mặc định)
}
function getCurrentBadge(){ return BADGE_TIERS[computeBadgeTierIndex()]; }

function todayStr(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function updateStreak(){
  const today = todayStr();
  let s = loadJSON(LS_STREAK, null);
  if(!s){ s = { lastDate: today, count: 1 }; saveJSON(LS_STREAK, s); return s; }
  if(s.lastDate === today) return s;
  const prev = new Date(s.lastDate);
  const diffDays = Math.round((new Date(today) - prev) / 86400000);
  s.count = (diffDays === 1) ? (s.count||0) + 1 : 1;
  s.lastDate = today;
  saveJSON(LS_STREAK, s);
  return s;
}
function getStreak(){ return loadJSON(LS_STREAK, {lastDate:"", count:0}); }

// CONFETTI (canvas nhẹ, dùng chung cho popup danh hiệu và khi đạt 1 chủ đề)
// ==========================================================================
function launchConfetti(canvas, opts){
  opts = opts || {};
  const count = opts.count || 90;
  const duration = opts.duration || 2600;
  const ctx = canvas.getContext("2d");
  function resize(){ canvas.width = canvas.offsetWidth; canvas.height = canvas.offsetHeight; }
  resize();
  const colors = ["#C5281C","#8F1B12","#E15243","#FFFFFF","#F5F5F5","#1A1A1A"];
  const pieces = [];
  for(let i=0;i<count;i++){
    pieces.push({
      x: Math.random()*canvas.width,
      y: -20 - Math.random()*canvas.height*0.5,
      size: 4 + Math.random()*6,
      color: colors[Math.floor(Math.random()*colors.length)],
      speedY: 2 + Math.random()*3,
      speedX: (Math.random()-0.5)*2,
      rot: Math.random()*360,
      rotSpeed: (Math.random()-0.5)*10
    });
  }
  let start = null;
  function frame(ts){
    if(!start) start = ts;
    const elapsed = ts - start;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    pieces.forEach(p=>{
      p.x += p.speedX; p.y += p.speedY; p.rot += p.rotSpeed;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot*Math.PI/180);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size*0.6);
      ctx.restore();
    });
    if(elapsed < duration){ requestAnimationFrame(frame); }
    else{ ctx.clearRect(0,0,canvas.width,canvas.height); }
  }
  requestAnimationFrame(frame);
}
function launchMiniConfetti(){
  const canvas = document.createElement("canvas");
  canvas.className = "mini-confetti-canvas";
  document.body.appendChild(canvas);
  canvas.style.width = "100%"; canvas.style.height = "100%";
  launchConfetti(canvas, { count:60, duration:2000 });
  setTimeout(()=>{ canvas.remove(); }, 2200);
}

function loadJSON(key, fallback){
  try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
  catch(e){ return fallback; }
}
function saveJSON(key, val){
  try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){ console.error("Lỗi lưu dữ liệu", e); }
}
function historyStorageKey(){
  const p = getProfile();
  if(!p) return LS_RECENT_HISTORY;
  // Lưu trên thiết bị học viên, nhưng tách theo hồ sơ để không lẫn lịch sử giữa các tài khoản.
  return LS_RECENT_HISTORY + "_" + btoa(unescape(encodeURIComponent(studentKey(p)))).replace(/[^a-zA-Z0-9]/g, "").slice(0,80);
}
function historyLoad(){ return loadJSON(historyStorageKey(), []); }
function historySave(arr){ saveJSON(historyStorageKey(), arr.slice(0, MAX_RECENT_HISTORY)); }
function historyCapture(){

    attemptNumber:r.attemptNumber, startedAt:r.startedAt, totalTimeMs:r.totalTimeMs,
    savedAt:Date.now()
  }));
  const arr=historyLoad();
  arr.unshift(record);
  historySave(arr);
}

function getProfile(){ return loadJSON(LS_PROFILE, null); }
function setProfile(p){ saveJSON(LS_PROFILE, p); }

function getProgress(){
  let p = loadJSON(LS_PROGRESS, null);
  if(!p){
    p = {};
    TOPICS_DATA.forEach((t, idx)=>{
      p[t.id] = { status: idx===0 ? "unlocked" : "locked", bestScore:0, attempts:0, sumScore:0 };
    });
    saveJSON(LS_PROGRESS, p);
  }
  TOPICS_DATA.forEach((t,idx)=>{ if(!p[t.id]) p[t.id] = { status: idx===0?"unlocked":"locked", bestScore:0, attempts:0, sumScore:0 }; });
  return p;
}
function setProgress(p){ saveJSON(LS_PROGRESS, p); }

function getMockProgress(){
  let p = loadJSON(LS_MOCK_PROGRESS, null);
  if(!p){
    p = {};
    MOCKS_DATA.forEach(m=>{ p[m.id] = { bestScore:0, attempts:0, sumScore:0 }; });
    saveJSON(LS_MOCK_PROGRESS, p);
  }
  MOCKS_DATA.forEach(m=>{ if(!p[m.id]) p[m.id] = { bestScore:0, attempts:0, sumScore:0 }; });
  return p;
}
function setMockProgress(p){ saveJSON(LS_MOCK_PROGRESS, p); }

function getWarnings(){ return loadJSON(LS_WARNINGS, []); }
function addWarning(entry){
  const w = getWarnings(); w.push(entry); saveJSON(LS_WARNINGS, w);
  syncToSheet("warning", entry);
}

function studentKey(profile){
  if(!profile) return "";
  return profile.name.trim().toUpperCase().replace(/\s+/g," ") + "|" + profile.dob + "|" + profile.cccd;
}

function formatDobVN(iso){
  if(!iso) return "";
  const [y,m,d] = iso.split("-");
  return `${d}/${m}/${y}`;
}
function formatStartTime(ts){
  const d = new Date(ts);
  const dd = String(d.getDate()).padStart(2,"0");
  const mm = String(d.getMonth()+1).padStart(2,"0");
  const yyyy = d.getFullYear();
  const hh = String(d.getHours()).padStart(2,"0");
  const min = String(d.getMinutes()).padStart(2,"0");
  return `${dd}/${mm}/${yyyy} ${hh}h${min}`;
}
function formatDurationVN(ms){
  const totalSec = Math.max(0, Math.round(ms/1000));
  const mins = Math.floor(totalSec/60);
  const secs = totalSec%60;
  return `${mins} phút ${secs} giây`;
}
function getGradeLabel(score){
  if(score >= 0.9) return {label:"EXCELLENT", cls:"excellent"};
  if(score >= PASS_THRESHOLD) return {label:"PASS", cls:"pass"};
  return {label:"FAIL", cls:"fail"};
}

/* ==========================================================================
   ĐỒNG BỘ GOOGLE SHEET (tùy chọn)
   ========================================================================== */
function syncToSheet(type, payload){
  if(!SHEET_WEBHOOK_URL || SHEET_WEBHOOK_URL.includes("PASTE_GOOGLE_APPS_SCRIPT")) return;
  const profile = getProfile();
  const body = Object.assign({
    type, timestamp: new Date().toISOString(),
    studentKey: studentKey(profile),
    name: profile ? profile.name : "",
    dob: profile ? profile.dob : "",
    gender: profile ? profile.gender : "",
    cccd: profile ? profile.cccd : "",
    classCode: profile ? profile.classCode : "",
    deviceId: getDeviceId()
  }, payload);
  fetch(SHEET_WEBHOOK_URL, {
    method:"POST",
    mode:"no-cors",
    headers:{"Content-Type":"text/plain"},
    body: JSON.stringify(body)
  }).catch(()=>{});
}
function getDeviceId(){
  let id = localStorage.getItem("iq_device_id");
  if(!id){ id = "dev_"+Math.random().toString(36).slice(2,10)+Date.now().toString(36); localStorage.setItem("iq_device_id", id); }
  return id;
}

function render(){
  const root = document.getElementById("app");
  const profile = getProfile();

  if(!profile){ root.innerHTML = renderRegister(); bindRegisterEvents(); return; }

  if(!_streakChecked){ updateStreak(); _streakChecked = true; }

  if(state.screen === "quiz" && state.quiz){
    root.innerHTML = renderQuizPage();
    bindQuizEvents();
    return;
  }

  if(state.screen === "result" && state.lastResult){
    root.innerHTML = renderTopBarSimple(profile) + renderResultScreen();
    bindResultEvents();
    return;
  }

  if(state.screen === "history"){
    renderHistoryScreen();
    return;
  }

  root.innerHTML = renderTopBarMain(profile, state.activeTab==="mocks" ? "mock" : "topic") + renderListScreen(state.activeTab==="mocks" ? "mock" : "topic");
  bindMainEvents();
  bindUtilityButtons();
  checkAndShowBadgePopup();
}

function computeListStats(kind){
  const dataset = getDataset(kind);
  const progress = kind==="mock" ? getMockProgress() : getProgress();
  const warnings = getWarnings();
  let passedCount=0, totalAttempts=0, sumBest=0, graded=0;
  dataset.forEach(item=>{
    const st = progress[item.id] || {};
    totalAttempts += st.attempts||0;
    if(kind==="topic" && st.status==="passed") passedCount++;
    if(kind==="mock" && (st.bestScore||0) >= PASS_THRESHOLD) passedCount++;
    if(st.attempts>0){ sumBest += st.bestScore||0; graded++; }
  });
  const avgScore = graded>0 ? Math.round((sumBest/graded)*100) : 0;
  return { passedCount, avgScore, totalAttempts, warningsCount: warnings.length, datasetLength: dataset.length };
}

function computeCardMeta(item, st, kind){
  const hasContent = item.questions.length > 0;
  let cardState = "unlocked";
  if(!hasContent) cardState = "empty";
  else if(kind==="topic" && st.status==="locked") cardState = "locked";
  else if(kind==="topic" && st.status==="passed") cardState = "passed";
  else if(kind==="mock" && st.attempts>0 && st.bestScore>=PASS_THRESHOLD) cardState = "passed";

  let icon = "▶️";
  if(cardState==="empty") icon = "🕓";
  else if(cardState==="locked") icon = "🔒";
  else if(cardState==="passed") icon = "✅";

  const bestFraction = st.attempts>0 ? `${String(Math.round((st.bestScore||0)*item.questions.length)).padStart(2,"0")}/${item.questions.length}` : "—";
  const avg = st.attempts>0 ? Math.round(((st.sumScore||0)/st.attempts)*100) : null;

  let meta1 = hasContent ? `${item.questions.length} câu hỏi` : "Nội dung đang được cập nhật";
  let meta2 = "";
  if(hasContent){
    if(cardState==="locked"){
      meta2 = `<div class="meta2">Hoàn thành chủ đề trước để mở khóa</div>`;
    } else {
      meta2 = `<div class="meta2">
        <span>🏆 Cao nhất: <b>${bestFraction}</b></span>
        <span>🔁 Lượt: <b>${st.attempts||0}</b></span>
        <span>📊 TB: <b>${avg!==null? avg+'%' : '—'}</b></span>
      </div>`;
    }
  }
  return { cardState, icon, meta1, meta2 };
}

function renderFlatCard(item, idx, stRaw, kind){
  const st = stRaw || {status: kind==="mock" ? "unlocked" : "locked", bestScore:0, attempts:0, sumScore:0};
  const { cardState, icon, meta1, meta2 } = computeCardMeta(item, st, kind);

}

/* ==========================================================================
   QUIZ ENGINE (dạng trượt kéo lên xuống — trả lời hết rồi mới nộp bài)
   ========================================================================== */
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

function startQuiz(kind, id){
  const dataset = getDataset(kind);
  const item = dataset.find(x=>x.id===id);
  // Chủ đề ôn tập: giữ nguyên thứ tự câu hỏi (không đảo).
  // Đề thi thử: đảo thứ tự câu hỏi (đáp án trong mỗi câu luôn giữ nguyên thứ tự ở cả 2 loại).
  const baseOrder = item.questions.map((_,i)=>i);
  const order = kind==="mock" ? shuffle(baseOrder) : baseOrder;
  const totalSeconds = EXAM_MINUTES * 60;
  state.quizKind = kind;
  state.currentItemId = id;
  state.quiz = { order, answers: new Array(order.length).fill(null), secondsLeft: totalSeconds, timerHandle:null, warningCount:0, startedAt: Date.now() };
  state.screen = "quiz";
  startAntiCheat();
  render();
  startTimer();
}

function startTimer(){
  if(state.quiz.timerHandle) clearInterval(state.quiz.timerHandle);
  state.quiz.timerHandle = setInterval(()=>{
    if(!state.quiz) return;
    state.quiz.secondsLeft--;
    const timerEl = document.getElementById("quizTimer");
    if(timerEl){
      const mm = String(Math.floor(Math.max(0,state.quiz.secondsLeft)/60)).padStart(2,"0");
      const ss = String(Math.max(0,state.quiz.secondsLeft)%60).padStart(2,"0");
      timerEl.textContent = "⏱ " + mm + ":" + ss;
    }
    if(state.quiz.secondsLeft<=0){
      clearInterval(state.quiz.timerHandle);
      finishQuiz(true);
    }
  }, 1000);
}

function renderQuizPage(){
  const item = getQuizItem();
  const q = state.quiz;
  const mm = String(Math.floor(q.secondsLeft/60)).padStart(2,"0");
  const ss = String(q.secondsLeft%60).padStart(2,"0");

  let slidesHtml = "";
  q.order.forEach((qIndex, i)=>{
    const question = item.questions[qIndex];
    let optsHtml = "";
    question.options.forEach((opt, oi)=>{
      const dotLabel = String.fromCharCode(65+oi);
      optsHtml += `<div class="opt" data-slide="${i}" data-opt="${oi}"><div class="dot">${dotLabel}</div><div>${escapeHtml(opt)}</div></div>`;
    });
    slidesHtml += `
    <section class="qslide" data-idx="${i}">
      <div class="qnum">Câu ${i+1}/${q.order.length}</div>
      <div class="qcard">
        <p class="qtext">${escapeHtml(question.q)}</p>
        <div>${optsHtml}</div>
      </div>
    </section>`;
  });
  slidesHtml += `
  <section class="qslide submit-slide" data-idx="${q.order.length}">
    <div class="icon">🎯</div>
    <h3>Bạn đã hoàn thành tất cả câu hỏi</h3>
    <p>Kiểm tra lại nếu cần, sau đó bấm Nộp bài để xem kết quả và giải thích chi tiết.</p>
  </section>`;

  return `
  <div class="quiz-page">
    <div class="quiz-header">
      <div class="quiz-header-row">
        <button class="exit-btn" id="btn_exit">THOÁT</button>
        <div class="quiz-title">${escapeHtml(item.name)}</div>
        <div class="timer" id="quizTimer">⏱ ${mm}:${ss}</div>
      </div>
      <div class="quiz-progress-track"><div class="quiz-progress-fill" id="quizProgressFill" style="width:0%"></div></div>
    </div>
    <div class="quiz-scroll" id="quizScroll">${slidesHtml}</div>
    <div class="quiz-footer">
      <div class="answered-count" id="answeredCount">Đã trả lời: 0/${q.order.length}</div>
      <button class="btn" id="btn_submit" disabled>Nộp bài</button>
    </div>
  </div>`;
}

function bindQuizEvents(){
  const item = getQuizItem();
  const q = state.quiz;
  const scrollEl = document.getElementById("quizScroll");
  const answeredCountEl = document.getElementById("answeredCount");
  const submitBtn = document.getElementById("btn_submit");
  const progressFill = document.getElementById("quizProgressFill");

  function refreshAnsweredUI(){
    const answered = q.answers.filter(a=>a!==null).length;
    answeredCountEl.textContent = `Đã trả lời: ${answered}/${q.order.length}`;
    submitBtn.disabled = answered < q.order.length;
  }
  refreshAnsweredUI();

  scrollEl.querySelectorAll(".opt").forEach(el=>{
    el.addEventListener("click", ()=>{
      const slideIdx = parseInt(el.dataset.slide,10);
      const optIdx = parseInt(el.dataset.opt,10);
      q.answers[slideIdx] = optIdx;
      hapticTick();
      scrollEl.querySelectorAll(`.opt[data-slide="${slideIdx}"]`).forEach(o=>o.classList.remove("selected"));
      el.classList.add("selected");
      refreshAnsweredUI();
      // Tự động đẩy lên câu tiếp theo sau khi chọn đáp án (chỉ tiến tới, không tự lùi lại).
      const nextSlide = scrollEl.querySelector(`.qslide[data-idx="${slideIdx+1}"]`);
      if(nextSlide){
        setTimeout(()=>{ nextSlide.scrollIntoView({behavior:"smooth", block:"start"}); }, 320);
      }
    });
  });

  scrollEl.addEventListener("scroll", ()=>{
    const pct = Math.min(100, Math.round((scrollEl.scrollTop / (scrollEl.scrollHeight - scrollEl.clientHeight || 1)) * 100));
    progressFill.style.width = pct + "%";
  });

  document.getElementById("btn_exit").onclick = showExitConfirm;
  submitBtn.onclick = ()=>{ if(!submitBtn.disabled) finishQuiz(false); };
}

  div.innerHTML = `

      <div class="micon">⚠️</div>
      <h3>Thoát khỏi bài làm?</h3>
      <p>Kết quả sẽ <b>không được ghi nhận</b> nếu bạn thoát bây giờ. Bạn có chắc chắn muốn thoát không?</p>
      <div class="modal-actions">
        <button class="btn secondary" id="modal_cancel">HỦY BỎ</button>
        <button class="btn" style="background:var(--danger)" id="modal_confirm">XÁC NHẬN</button>
      </div>
    </div>`;
  document.body.appendChild(div);
  document.getElementById("modal_cancel").onclick = ()=> div.remove();
  document.getElementById("modal_confirm").onclick = ()=>{
    div.remove();
    exitQuizWithoutSaving();
  };
}

function exitQuizWithoutSaving(){
  if(state.quiz && state.quiz.timerHandle) clearInterval(state.quiz.timerHandle);
  stopAntiCheat();
  state.quiz = null;
  state.screen = null;
  render();
}

function finishQuiz(timeUp){
  const kind = state.quizKind;
  const item = getQuizItem();
  const q = state.quiz;
  if(q.timerHandle) clearInterval(q.timerHandle);
  stopAntiCheat();

  let correct = 0;
  const reviewItems = [];
  q.order.forEach((qIndex, i)=>{
    const question = item.questions[qIndex];
    const ans = q.answers[i];
    const isCorrect = ans === question.answer;
    if(isCorrect) correct++;
    reviewItems.push({ q:question.q, options:question.options, answer:question.answer, chosen:ans, explain:question.explain, isCorrect });
  });
  const total = item.questions.length;
  const score = total>0 ? correct/total : 0;
  const passed = score >= PASS_THRESHOLD;
  let attemptNumber = 1;

  if(kind==="topic"){
    const progress = getProgress();
    const st = progress[item.id] || {status:"unlocked", bestScore:0, attempts:0, sumScore:0};
    st.attempts = (st.attempts||0)+1;
    attemptNumber = st.attempts;
    st.sumScore = (st.sumScore||0)+score;
    st.bestScore = Math.max(st.bestScore||0, score);
    if(passed) st.status = "passed"; else if(st.status!=="passed") st.status = "unlocked";
    progress[item.id] = st;
    if(passed){
      const idx = TOPICS_DATA.findIndex(t=>t.id===item.id);
      const nextTopic = TOPICS_DATA[idx+1];
      if(nextTopic){
        const nst = progress[nextTopic.id] || {status:"locked", bestScore:0, attempts:0, sumScore:0};
        if(nst.status==="locked") nst.status = "unlocked";
        progress[nextTopic.id] = nst;
      }
    }
    setProgress(progress);
  } else if(kind==="mock"){
    const mp = getMockProgress();
    const st = mp[item.id] || {bestScore:0, attempts:0, sumScore:0};
    st.attempts = (st.attempts||0)+1;
    attemptNumber = st.attempts;
    st.sumScore = (st.sumScore||0)+score;
    st.bestScore = Math.max(st.bestScore||0, score);
    mp[item.id] = st;
    setMockProgress(mp);
  }
  // kind === "review" (ôn lại câu sai): không ghi nhận điểm/lượt làm, chỉ hiển thị kết quả tham khảo

  if(kind!=="review"){
    syncToSheet("quiz_result", {
      kind,
      itemId:item.id,
      itemName:item.name,
      score,
      correct,
      total,
      passed,
      timeUp,
      warnings:q.warningCount||0,
      attemptNumber,
      startedAt: q.startedAt || Date.now(),
      totalTimeMs: Math.max(0, Date.now() - (q.startedAt || Date.now()))
    });
  }

  const startedAt = q.startedAt || Date.now();
  const totalTimeMs = Date.now() - startedAt;

  state.lastResult = { item, kind, score, correct, total, passed, timeUp, reviewItems, attemptNumber, startedAt, totalTimeMs };
  historyCapture();
  state.quiz = null;
  state.screen = "result";
  render();
  if(passed && kind==="topic"){ setTimeout(()=> launchMiniConfetti(), 200); }
}

function renderResultScreen(){
  const r = state.lastResult;
  const pct = Math.round(r.score*100);
  const grade = getGradeLabel(r.score);
  const backLabel = r.kind==="mock" ? "Quay lại Đề thi thử" : (r.kind==="review" ? "Quay lại danh sách" : "Quay lại Chủ đề ôn tập");
  const wrongCount = r.reviewItems.filter(it=>!it.isCorrect).length;
  let html = `<div class="screen">`;
  html += `
    <div class="result-hero">
      <p class="result-item-name">${escapeHtml(r.item.name)}</p>
      <div class="result-ring ${r.passed?'pass':'fail'}" id="resultRing" style="--pct:0"><div class="inner">${r.correct}/${r.total}</div></div>
      <p class="result-title">${r.passed ? "🎉 Đạt yêu cầu!" : "Chưa đạt 80%"}</p>
      <span class="result-grade ${grade.cls}">${grade.label}</span>
      <p class="result-sub">${pct}% chính xác ${r.timeUp?"· Hết giờ làm bài":""}${r.kind==='topic' && r.passed ? " · Chủ đề tiếp theo đã được mở khóa" : ""}</p>
      <div class="result-extra">
        ${r.kind!=="review" ? `<div>Attempt: <b>${r.attemptNumber}</b></div>` : ""}
        <div>Start Time: <b>${formatStartTime(r.startedAt)}</b></div>
        <div>Total Time: <b>${formatDurationVN(r.totalTimeMs)}</b></div>
      </div>
      <div style="margin-top:16px;">
        <button class="btn btn-backlist" style="margin-bottom:10px;">${backLabel}</button>
        ${(wrongCount>0 && r.kind!=="review") ? `<button class="btn" id="btn_review_wrong">🔁 Ôn lại ${wrongCount} câu sai</button>` : ""}
      </div>
    </div>
    <p class="section-title">Xem lại bài làm</p>`;
  r.reviewItems.forEach((it, idx)=>{
    let optsHtml = "";
    it.options.forEach((opt, oi)=>{
      const dotLabel = String.fromCharCode(65+oi);
      let cls = "opt review-opt";
      if(oi === it.answer) cls += " correct";
      else if(oi === it.chosen) cls += " incorrect";
      optsHtml += `<div class="${cls}"><div class="dot">${dotLabel}</div><div>${escapeHtml(opt)}</div></div>`;
    });
    html += `
    <div class="review-item">
      <span class="review-tag ${it.isCorrect?'ok':'bad'}">${it.isCorrect ? "Đúng":"Sai"}</span>
      <p class="review-q">Câu ${idx+1}: ${escapeHtml(it.q)}</p>
      <div style="margin-bottom:8px;">${optsHtml}</div>
      ${it.chosen===null ? `<p style="font-size:12.5px;color:var(--ink-soft);margin:0 0 8px;"><i>Chưa trả lời</i></p>` : ""}
      <div class="explain-box"><b>Giải thích:</b> ${escapeHtml(it.explain)}</div>
    </div>`;
  });
  html += `<button class="btn btn-backlist" style="margin-top:6px;">${backLabel}</button>`;
  html += `</div>`;
  return html;
}
function bindResultEvents(){
  const r = state.lastResult;
  const pct = Math.round(r.score*100);
  const ring = document.getElementById("resultRing");
  if(ring){
    let cur = 0;
    const step = ()=>{
      cur += Math.max(1, Math.round(pct/20));
      if(cur >= pct){ cur = pct; ring.style.setProperty("--pct", cur); return; }
      ring.style.setProperty("--pct", cur);
      requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }
  document.querySelectorAll(".btn-backlist").forEach(btn=>{
    btn.onclick = ()=>{
      state.activeTab = state.lastResult.kind==="mock" ? "mocks" : "topics";
      state.screen = null; state.lastResult = null;
      render();
    };
  });
  const reviewBtn = document.getElementById("btn_review_wrong");
  if(reviewBtn){
    reviewBtn.onclick = ()=>{
      const wrongQuestions = r.reviewItems.filter(it=>!it.isCorrect).map(it=>({
        q: it.q, options: it.options, answer: it.answer, explain: it.explain
      }));
      startReviewQuiz(wrongQuestions, r.item.name);
    };
  }
}
function startReviewQuiz(questions, originalName){
  state.reviewItem = { id: -1, name: `Ôn lại câu sai · ${originalName}`, questions };
  state.quizKind = "review";
  state.currentItemId = -1;
  const order = questions.map((_,i)=>i);
  state.quiz = { order, answers: new Array(order.length).fill(null), secondsLeft: EXAM_MINUTES*60, timerHandle:null, warningCount:0, startedAt: Date.now() };
  state.screen = "quiz";
  startAntiCheat();
  render();
  startTimer();
}

/* ==========================================================================
   ANTI-CHEAT
   ========================================================================== */
let _hiddenSince = null;
function onVisibilityChange(){
  if(document.hidden){ _hiddenSince = Date.now(); }
  else if(_hiddenSince){
    const awaySeconds = Math.round((Date.now()-_hiddenSince)/1000);
    _hiddenSince = null;
    if(awaySeconds>=2 && state.quiz) registerCheatWarning(awaySeconds);
  }
}
function registerCheatWarning(awaySeconds){
  if(!state.quiz) return;
  state.quiz.warningCount = (state.quiz.warningCount||0)+1;
  const item = getQuizItem();
  addWarning({ itemKind: state.quizKind, itemId: state.currentItemId, itemName: item?item.name:"", timestamp:new Date().toISOString(), awaySeconds });
  showWarningBanner(awaySeconds);
}
function showWarningBanner(awaySeconds){
  const old = document.querySelector(".warn-banner"); if(old) old.remove();
  const b = document.createElement("div");
  b.className = "warn-banner";
  b.textContent = `CẢNH BÁO — Bạn vừa thoát ra màn hình ứng dụng (${awaySeconds}s) — hành động này đã được ghi nhận`;
  document.body.appendChild(b);
  setTimeout(()=>b.remove(), 4000);
}
function startAntiCheat(){ document.addEventListener("visibilitychange", onVisibilityChange); }
function stopAntiCheat(){ document.removeEventListener("visibilitychange", onVisibilityChange); }

/* ==========================================================================
   UTIL
   ========================================================================== */
function escapeHtml(str){
  if(str===undefined||str===null) return "";
  return String(str).replace(/[&<>"']/g, s=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[s]));
}
// Chèn khoảng trắng không ngắt dòng (\u00A0) giữa các cụm từ ghép quan trọng,
// tránh tình trạng vỡ dòng giữa chừng gây phản cảm (ví dụ "Đại" xuống dòng tách khỏi "lý").
const NO_BREAK_PHRASES = [
  "Đại lý", "vững chắc", "Tư vấn viên", "Chiến Binh Sư Tử", "Danh hiệu",
  "kỳ thi", "Chứng chỉ", "Nhân thọ", "chuyên nghiệp", "Sư Tử", "Chào mừng",
  "Bảo hiểm", "hành trình", "bước chân", "bản lĩnh", "dừng bước", "mục tiêu"
];
function applyNoBreak(str){
  if(!str) return str;
  let out = String(str);
  NO_BREAK_PHRASES.forEach(p=>{ out = out.split(p).join(p.replace(/ /g, "\u00A0")); });
  return out;
}

render();
</script>
