<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Ôn thi Đại lý Bảo hiểm Nhân thọ</title>
<style>
  :root{
    --maroon:#C5281C;
    --maroon-dark:#8F1B12;
    --maroon-light:#E15243;
    --bg:#FBF3F1;
    --card:#FFFFFF;
    --ink:#241414;
    --ink-soft:#6b5b58;
    --border:#EADDDA;
    --success:#1E7A46;
    --success-bg:#E8F5EC;
    --danger:#B3261E;
    --danger-bg:#FCEBEA;
    --lock:#B8AAA7;
    --radius:16px;
    --shadow: 0 4px 18px rgba(139,30,30,0.08);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .app-bg{ position:fixed; inset:0; z-index:0; background-size:cover; background-position:center 20%; background-color:#8a1a12; }
  .app-bg-tint{ position:fixed; inset:0; z-index:1; background: linear-gradient(180deg, rgba(197,40,28,.42) 0%, rgba(197,40,28,.38) 45%, rgba(251,243,241,.94) 92%); }
  #app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    background: transparent;
    position:relative;
    z-index:2;
  }
  button{font-family:inherit;}

  /* ================= REGISTRATION ================= */
  .reg-page{ position:relative; min-height:100vh; overflow:hidden; }
  .reg-bg{
    position:fixed; inset:0; z-index:0;
    background-size:cover; background-position:center 20%;
    background-color:#8a1a12;
  }
  .reg-overlay{
    position:fixed; inset:0; z-index:1;
    background: linear-gradient(180deg, rgba(197,40,28,.42) 0%, rgba(197,40,28,.38) 45%, rgba(251,243,241,.97) 92%);
  }
  .reg-content{ position:relative; z-index:2; padding:38px 18px 30px; }
  .reg-hero{ text-align:center; color:#fff; margin-bottom:24px; padding-top:6px; }
  .reg-hero h1{ font-size:25px; font-weight:800; margin:0 0 8px; line-height:1.3; letter-spacing:.5px;
    text-shadow:0 2px 10px rgba(0,0,0,.45);}
  .reg-hero p{ font-size:14px; margin:0; font-style:italic; font-weight:600; text-shadow:0 2px 8px rgba(0,0,0,.45); }
  .reg-card{
    background:var(--card); border-radius:var(--radius); padding:24px 20px;
    box-shadow: 0 12px 32px rgba(0,0,0,.18);
  }
  .reg-title{ font-size:17px; font-weight:800; color:var(--maroon); margin:0 0 4px;}
  .reg-sub{ font-size:12.5px; color:var(--ink-soft); margin:0 0 18px; line-height:1.5;}
  .field{margin-bottom:16px;}
  .field label{display:block; font-size:13px; font-weight:600; margin-bottom:6px; color:var(--ink);}
  .field .hint{font-size:11.5px; color:var(--ink-soft); margin-top:4px;}
  input[type=text], select{
    width:100%; padding:12px 14px; border-radius:10px; border:1.5px solid var(--border);
    font-size:15px; background:#fff; color:var(--ink); font-family:inherit;
  }
  input:focus, select:focus{ outline:none; border-color:var(--maroon-light); }
  .dob-row{ display:grid; grid-template-columns: 1fr 1.3fr 1fr; gap:8px; }
  .dob-row select{ padding:12px 6px; font-size:13.5px; }
  .dob-preview{ font-size:12.5px; color:var(--maroon); font-weight:700; margin-top:6px; }
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    width:100%; padding:14px; border-radius:12px; border:none;
    background: var(--maroon); color:#fff; font-size:15px; font-weight:700;
    cursor:pointer; transition:transform .1s ease, background .15s ease;
  }
  .btn:active{ transform:scale(.98); }
  .btn:disabled{ background:#d8c9c6; cursor:not-allowed; }
  .btn.secondary{ background:#fff; color:var(--maroon); border:1.5px solid var(--maroon); }
  .btn.danger-outline{ background:#fff; color:var(--danger); border:1.5px solid var(--danger); }
  .error-msg{ color:var(--danger); font-size:12.5px; margin-top:6px; display:none;}

  /* ================= MAIN HEADER / TABS ================= */
  .topbar{
    background: linear-gradient(rgba(197,40,28,.55), rgba(197,40,28,.55)),
      url('https://images.unsplash.com/photo-1758518731468-98e90ffd7430?fm=jpg&q=70&w=1200&auto=format&fit=crop&ixlib=rb-4.1.0') center 20%/cover;
    background-color: var(--maroon);
    color:#fff;
    padding:16px 18px 0;
    position:sticky; top:0; z-index:20;
    box-shadow: var(--shadow);
  }
  .topbar-toprow{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
  .student-name{ font-size:19px; font-weight:800; line-height:1.25; }
  .app-title{ font-size:11.5px; opacity:.78; margin-top:3px; font-weight:600; letter-spacing:.3px;}
  .export-btn{ background:rgba(255,255,255,.16); border:none; color:#fff; width:34px; height:34px; border-radius:50%;
    font-size:15px; cursor:pointer; flex-shrink:0; }
  .logout-btn{
    background: var(--maroon-dark); border:none; color:#fff;
    padding:10px 20px; border-radius:16px; font-size:12.5px; font-weight:800;
    cursor:pointer; flex-shrink:0; letter-spacing:.4px;
    box-shadow: 0 3px 0 #5c0f09, 0 5px 10px rgba(0,0,0,.28);
    transition: transform .08s ease, box-shadow .08s ease;
  }
  .logout-btn:active{ transform: translateY(2px); box-shadow: 0 1px 0 #5c0f09, 0 2px 5px rgba(0,0,0,.22); }
  .tabbar{ display:flex; gap:6px; margin-top:14px; }
  .tab{ flex:1; text-align:center; padding:10px 4px; font-size:13px; font-weight:700;
    color:rgba(255,255,255,.7); border-bottom:3px solid transparent; cursor:pointer;}
  .tab.active{ color:#fff; border-bottom-color:#fff; }

  .screen{ padding:16px 18px 90px; animation: fadeIn .25s ease; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

  .stat-strip{ display:flex; gap:8px; margin-bottom:16px; }
  .stat-chip{ flex:1; background:var(--card); border-radius:12px; padding:10px 6px; text-align:center; box-shadow:var(--shadow); }
  .stat-chip .n{ font-size:16px; font-weight:800; color:var(--maroon); }
  .stat-chip .l{ font-size:10px; color:var(--ink-soft); margin-top:1px; }

  .section-title{ font-size:12.5px; font-weight:700; color:var(--maroon); text-transform:uppercase;
    letter-spacing:.5px; margin:4px 0 10px 2px;}

  /* ================= ITEM CARDS (chủ đề / đề thi thử) ================= */
  .topic-card{
    background:var(--card); border-radius:14px; padding:14px 16px; margin-bottom:11px;
    box-shadow:var(--shadow); display:flex; align-items:center; gap:13px; cursor:pointer;
    border:1.5px solid transparent;
  }
  .topic-card.locked, .topic-card.empty{ opacity:.55; cursor:not-allowed; }
  .topic-card.passed{ border-color:var(--success); }
  .topic-badge{
    width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:14px; flex-shrink:0; color:#fff; background:var(--maroon);
  }
  .topic-card.locked .topic-badge, .topic-card.empty .topic-badge{ background:var(--lock); }
  .topic-card.passed .topic-badge{ background:var(--success); }
  .topic-info{flex:1; min-width:0;}
  .topic-info .name{ font-size:14px; font-weight:700; margin:0 0 4px; text-transform:uppercase; letter-spacing:.2px; }
  .topic-info .meta1{ font-size:11.5px; color:var(--ink-soft); margin-bottom:3px;}
  .topic-info .meta2{ display:flex; flex-wrap:wrap; gap:4px 10px; font-size:11px; color:var(--ink-soft); }
  .topic-info .meta2 b{ color:var(--ink); }
  .topic-status{ font-size:17px; flex-shrink:0; }

  /* ================= QUIZ TAKING (swipe) ================= */
  .quiz-page{ position:fixed; inset:0; z-index:50; background:var(--bg); display:flex; flex-direction:column; }
  .quiz-header{ background:var(--maroon); color:#fff; padding:14px 14px; flex-shrink:0; }
  .quiz-header-row{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .exit-btn{
    background: var(--maroon-dark); border:none; color:#fff;
    padding:9px 16px; border-radius:14px; font-size:12px; font-weight:800;
    cursor:pointer; flex-shrink:0; letter-spacing:.4px;
    box-shadow: 0 3px 0 #5c0f09, 0 5px 9px rgba(0,0,0,.28);
    transition: transform .08s ease, box-shadow .08s ease;
  }
  .exit-btn:active{ transform: translateY(2px); box-shadow: 0 1px 0 #5c0f09, 0 2px 4px rgba(0,0,0,.22); }
  .quiz-title{ font-size:14.5px; font-weight:800; flex:1; text-align:center; padding:0 6px;
    text-transform:uppercase; letter-spacing:.3px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .timer{ font-weight:800; font-size:18px; background:rgba(255,255,255,.18); padding:8px 15px; border-radius:14px; flex-shrink:0;}
  .quiz-progress-track{ height:5px; background:rgba(255,255,255,.25); border-radius:6px; margin-top:12px; overflow:hidden;}
  .quiz-progress-fill{ height:100%; background:#fff; border-radius:6px; transition:width .2s ease;}

  .quiz-scroll{ flex:1; overflow-y:auto; scroll-snap-type:y mandatory; -webkit-overflow-scrolling:touch; }
  .qslide{ scroll-snap-align:start; min-height:100%; display:flex; flex-direction:column; justify-content:center;
    padding:22px 20px 30px; }
  .qslide .qnum{ font-size:12px; font-weight:700; color:var(--maroon-light); margin-bottom:8px;}
  .qcard{ background:var(--card); border-radius:var(--radius); padding:20px; box-shadow:var(--shadow); }
  .qtext{ font-size:16px; font-weight:700; line-height:1.5; margin:0 0 18px;}
  .opt{
    display:flex; align-items:flex-start; gap:12px; padding:13px 14px; border:1.5px solid var(--border);
    border-radius:12px; margin-bottom:10px; cursor:pointer; font-size:14.5px; line-height:1.5;
  }
  .opt.selected{ border-color:var(--maroon-light); background:#FDF1EF; }
  .opt .dot{ width:20px; height:20px; border-radius:50%; border:2px solid var(--border); flex-shrink:0; margin-top:1px;
    display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; color:#fff;}
  .opt.selected .dot{ border-color:var(--maroon-light); background:var(--maroon-light); }
  .swipe-hint{ text-align:center; font-size:11.5px; color:var(--ink-soft); margin-top:14px; }

  .submit-slide{ align-items:center; text-align:center; }
  .submit-slide .icon{ font-size:44px; margin-bottom:10px; }
  .submit-slide h3{ font-size:17px; margin:0 0 6px; }
  .submit-slide p{ font-size:13px; color:var(--ink-soft); margin:0 0 20px; }

  .quiz-footer{ flex-shrink:0; background:#fff; border-top:1px solid var(--border); padding:10px 16px;
    display:flex; align-items:center; gap:12px; }
  .answered-count{ font-size:12px; color:var(--ink-soft); font-weight:600; white-space:nowrap; }
  .quiz-footer .btn{ padding:11px; font-size:14px; }

  /* ================= MODAL ================= */
  .modal-backdrop{ position:fixed; inset:0; background:rgba(20,8,8,.55); z-index:200; display:flex;
    align-items:center; justify-content:center; padding:24px; animation: fadeIn .15s ease;}
  .modal-box{ background:#fff; border-radius:16px; padding:22px 20px; max-width:340px; width:100%; text-align:center;}
  .modal-box .micon{ font-size:34px; margin-bottom:8px;}
  .modal-box h3{ font-size:16.5px; margin:0 0 8px;}
  .modal-box p{ font-size:13px; color:var(--ink-soft); margin:0 0 20px; line-height:1.5;}
  .modal-actions{ display:flex; gap:10px; }
  .modal-actions .btn{ flex:1; }

  /* ================= RESULT ================= */
  .result-hero{ text-align:center; padding:26px 10px 6px;}
  .result-item-name{ font-size:18px; font-weight:800; color:var(--maroon); text-transform:uppercase;
    letter-spacing:.3px; margin:0 0 18px; line-height:1.35; }
  .result-ring{ width:112px; height:112px; border-radius:50%; margin:0 auto 14px; display:flex; align-items:center;
    justify-content:center; font-size:26px; font-weight:800; color:#fff; }
  .result-ring.pass{ background: conic-gradient(var(--success) 0deg, var(--success) calc(var(--pct)*3.6deg), #ddd calc(var(--pct)*3.6deg)); }
  .result-ring.fail{ background: conic-gradient(var(--danger) 0deg, var(--danger) calc(var(--pct)*3.6deg), #ddd calc(var(--pct)*3.6deg)); }
  .result-ring .inner{ width:90px; height:90px; border-radius:50%; background:#fff; display:flex; align-items:center;
    justify-content:center; color:var(--ink); }
  .result-title{ font-size:18px; font-weight:800; margin:6px 0 2px;}
  .result-sub{ font-size:13px; color:var(--ink-soft); margin-bottom:18px; }
  .review-item{ background:var(--card); border-radius:12px; padding:14px; margin-bottom:10px; box-shadow:var(--shadow);}
  .review-q{ font-size:13.5px; font-weight:700; margin:0 0 8px;}
  .review-tag{ display:inline-block; font-size:11px; font-weight:800; padding:2px 8px; border-radius:20px; margin-bottom:8px;}
  .review-tag.ok{ background:var(--success-bg); color:var(--success); }
  .review-tag.bad{ background:var(--danger-bg); color:var(--danger); }
  .explain-box{ margin-top:10px; background:#FBF6E9; border-left:4px solid #D9A62E; padding:10px 12px;
    border-radius:8px; font-size:12.5px; line-height:1.6; color:#5a4a1c;}
  .explain-box b{ color:#8a6a10; }

  .warn-banner{
    position:fixed; top:0; left:0; right:0; z-index:999; background:var(--danger); color:#fff;
    text-align:center; font-size:13px; font-weight:700; padding:10px 16px;
    animation: slideDown .25s ease;
  }
  @keyframes slideDown{ from{transform:translateY(-100%);} to{transform:translateY(0);} }
  .empty{ text-align:center; padding:40px 20px; color:var(--ink-soft); font-size:13.5px;}
</style>
</head>
<body>
<div id="app"></div>

<script>
// ==========================================================================
// NGÂN HÀNG CÂU HỎI - 3 CHỦ ĐỀ ĐẦU TIÊN
// Căn cứ pháp lý: Luật Kinh doanh bảo hiểm 2022 (Luật số 08/2022/QH15),
// Nghị định 46/2023/NĐ-CP, Thông tư 67/2023/TT-BTC
// ==========================================================================

const TOPICS_DATA = [
  {
    id: 1,
    name: "Nguồn gốc & Vai trò bảo hiểm",
    questions: [
      {
        q: "Rủi ro ngẫu nhiên là gì?",
        options: ["Bất ngờ", "Không lường trước được về không gian, thời gian, cũng như mức độ nghiêm trọng", "Cả A và B đều đúng"],
        answer: 2,
        explain: "Rủi ro ngẫu nhiên (fortuitous risk) là rủi ro mang tính bất ngờ, không thể dự đoán chính xác về thời điểm, địa điểm và mức độ nghiêm trọng khi xảy ra. Đây là điều kiện tiên quyết để một rủi ro được coi là 'có thể được bảo hiểm' — nếu sự kiện chắc chắn xảy ra hoặc do cố ý gây ra thì không còn là rủi ro ngẫu nhiên nữa."
      },
      {
        q: "Bảo hiểm là phương pháp quản lý rủi ro nào sau đây:",
        options: ["Giữ lại rủi ro.", "Né tránh rủi ro.", "Kiểm soát rủi ro.", "Chuyển giao rủi ro"],
        answer: 3,
        explain: "Trong 4 nhóm phương pháp quản lý rủi ro (né tránh, chấp nhận/giữ lại, kiểm soát/giảm thiểu, chuyển giao), bảo hiểm thuộc nhóm chuyển giao rủi ro: người tham gia bảo hiểm chuyển gánh nặng tài chính của rủi ro sang doanh nghiệp bảo hiểm thông qua việc đóng phí bảo hiểm."
      },
      {
        q: "Chọn phương án đúng nhất về phương pháp quản lý rủi ro:",
        options: ["Né tránh rủi ro", "Chấp nhận rủi ro", "Kiểm soát rủi ro", "Chuyển giao rủi ro", "A,B,C,D đúng"],
        answer: 4,
        explain: "Lý thuyết quản trị rủi ro chia thành 4 nhóm phương pháp cơ bản: né tránh (avoidance), chấp nhận/giữ lại (retention), kiểm soát/giảm thiểu (control), và chuyển giao (transfer) — bảo hiểm là một hình thức chuyển giao rủi ro phổ biến nhất."
      },
      {
        q: "Tiêu chí nào sau đây là tiêu chí đánh giá rủi ro:",
        options: ["Mức độ rủi ro và kiểm soát rủi ro", "Mức độ rủi ro và nguy cơ rủi ro", "Nguy cơ rủi ro và kiểm soát rủi ro", "A, B, C đúng"],
        answer: 1,
        explain: "Đánh giá rủi ro trong bảo hiểm thường dựa trên hai yếu tố: mức độ rủi ro (mức độ nghiêm trọng/tần suất tổn thất có thể xảy ra) và nguy cơ rủi ro (các yếu tố làm tăng khả năng hoặc mức độ tổn thất, ví dụ tình trạng sức khỏe, nghề nghiệp, môi trường sống)."
      },
      {
        q: "Rủi ro có thể được bảo hiểm và được DN bảo hiểm chấp nhận bảo hiểm là rủi ro được bảo hiểm:",
        options: ["Đúng", "Sai"],
        answer: 0,
        explain: "Đây là định nghĩa chuẩn: một rủi ro chỉ trở thành 'rủi ro được bảo hiểm' khi vừa thỏa mãn các điều kiện có thể được bảo hiểm (ngẫu nhiên, định lượng được, có số đông, không trái đạo đức), vừa được doanh nghiệp bảo hiểm chấp thuận bảo hiểm trong hợp đồng cụ thể."
      },
      {
        q: "Phát biểu nào sau đây là đúng nhất về rủi ro loại trừ:",
        options: ["Là rủi ro không thể được bảo hiểm", "Là rủi có thể được bảo hiểm nhưng doanh nghiệp bảo hiểm không chấp nhận bảo hiểm", "A, B đúng", "A, B sai"],
        answer: 2,
        explain: "Rủi ro loại trừ có thể rơi vào hai trường hợp: (1) bản chất không đáp ứng điều kiện để được bảo hiểm (ví dụ không định lượng được, không ngẫu nhiên), hoặc (2) về nguyên tắc có thể bảo hiểm được nhưng doanh nghiệp bảo hiểm chủ động loại trừ trong quy tắc, điều khoản của sản phẩm (ví dụ tự tử trong 2 năm đầu, chiến tranh...)."
      },
      {
        q: "Rủi ro được coi là rủi ro có thể được bảo hiểm khi đáp ứng các điều kiện sau:",
        options: ["Tổn thất phải ngẫu nhiên, bất ngờ.", "Phải đo được, định lượng được về tài chính.", "Phải có số đông.", "Không trái với chuẩn mực đạo đức xã hội.", "A, B, C, D đúng"],
        answer: 4,
        explain: "4 điều kiện kinh điển để một rủi ro 'có thể được bảo hiểm': tổn thất ngẫu nhiên/bất ngờ, định lượng được bằng tiền, có số đông đối tượng tương tự cùng tham gia, và không trái đạo đức, pháp luật xã hội."
      },
      {
        q: "Quy luật số đông được hiểu là (chọn phương án đúng nhất):",
        options: ["Số lượng đủ lớn các đối tượng được bảo hiểm nhằm bù đắp cho số ít đối tượng đó bị tổn thất trong thời hạn bảo hiểm", "Các đối tượng bảo hiểm phải đồng nhất", "Các đối tượng bảo hiểm phải độc lập với nhau", "A, C đúng", "A, B, C đúng"],
        answer: 4,
        explain: "Quy luật số đông (law of large numbers) là nền tảng toán học của bảo hiểm: cần một số lượng đủ lớn các đối tượng tương đồng về bản chất rủi ro (đồng nhất), độc lập với nhau về khả năng xảy ra tổn thất, để phí bảo hiểm thu từ số đông người tham gia đủ bù đắp cho số ít người thực sự gặp rủi ro."
      },

/* ==========================================================================
   STORAGE HELPERS
   ========================================================================== */
function loadJSON(key, fallback){
  try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
  catch(e){ return fallback; }
}
function saveJSON(key, val){
  try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){ console.error("Lỗi lưu dữ liệu", e); }
}
function getProfile(){ return loadJSON(LS_PROFILE, null); }
function setProfile(p){ saveJSON(LS_PROFILE, p); }

function getProgress(){
  let p = loadJSON(LS_PROGRESS, null);
  if(!p){
    p = {};
    TOPICS_DATA.forEach((t, idx)=>{
      p[t.id] = { status: idx===0 ? "unlocked" : "locked", bestScore:0, attempts:0, sumScore:0 };
    });
    saveJSON(LS_PROGRESS, p);
  }
  TOPICS_DATA.forEach((t,idx)=>{ if(!p[t.id]) p[t.id] = { status: idx===0?"unlocked":"locked", bestScore:0, attempts:0, sumScore:0 }; });
  return p;
}
function setProgress(p){ saveJSON(LS_PROGRESS, p); }

function getMockProgress(){
  let p = loadJSON(LS_MOCK_PROGRESS, null);
  if(!p){
    p = {};
    MOCKS_DATA.forEach(m=>{ p[m.id] = { bestScore:0, attempts:0, sumScore:0 }; });
    saveJSON(LS_MOCK_PROGRESS, p);
  }
  MOCKS_DATA.forEach(m=>{ if(!p[m.id]) p[m.id] = { bestScore:0, attempts:0, sumScore:0 }; });
  return p;
}
function setMockProgress(p){ saveJSON(LS_MOCK_PROGRESS, p); }

function getWarnings(){ return loadJSON(LS_WARNINGS, []); }
function addWarning(entry){
  const w = getWarnings(); w.push(entry); saveJSON(LS_WARNINGS, w);
  syncToSheet("warning", entry);
}

function studentKey(profile){
  if(!profile) return "";
  return profile.name.trim().toUpperCase().replace(/\s+/g," ") + "|" + profile.dob + "|" + profile.cccd;
}

function formatDobVN(iso){
  if(!iso) return "";
  const [y,m,d] = iso.split("-");
  return `${d}/${m}/${y}`;
}

/* ==========================================================================
   ĐỒNG BỘ GOOGLE SHEET (tùy chọn)
   ========================================================================== */
function syncToSheet(type, payload){
  if(!SHEET_WEBHOOK_URL) return;
  const profile = getProfile();
  const body = Object.assign({
    type, timestamp: new Date().toISOString(),
    studentKey: studentKey(profile),
    name: profile ? profile.name : "",
    dob: profile ? profile.dob : "",
    classCode: profile ? profile.classCode : "",
    deviceId: getDeviceId()
  }, payload);
  fetch(SHEET_WEBHOOK_URL, { method:"POST", mode:"no-cors", headers:{"Content-Type":"text/plain"}, body: JSON.stringify(body) })
    .catch(()=>{});
}
function getDeviceId(){
  let id = localStorage.getItem("iq_device_id");
  if(!id){ id = "dev_"+Math.random().toString(36).slice(2,10)+Date.now().toString(36); localStorage.setItem("iq_device_id", id); }
  return id;
}

function render(){
  const root = document.getElementById("app");

  if(!profile){ root.innerHTML = renderRegister(); bindRegisterEvents(); return; }

  if(state.screen === "quiz" && state.quiz){
    root.innerHTML = renderQuizPage();
    bindQuizEvents();
    return;
  }

  if(state.screen === "result" && state.lastResult){
    root.innerHTML = renderTopBarSimple(profile) + renderResultScreen();
    bindResultEvents();
    return;
  }

  root.innerHTML = renderTopBarMain(profile) + renderListScreen(state.activeTab==="mocks" ? "mock" : "topic");
  bindMainEvents();
}

function updateDobPreview(){
  const d = document.getElementById("f_dob_d").value;
  const m = document.getElementById("f_dob_m").value;
  const y = document.getElementById("f_dob_y").value;
  const el = document.getElementById("dobPreview");
  if(d && m && y){ el.textContent = `Đã chọn: ${d.padStart(2,"0")}/${m.padStart(2,"0")}/${y}`; }
  else { el.textContent = ""; }
}

function bindRegisterEvents(){
  ["f_dob_d","f_dob_m","f_dob_y"].forEach(id=>{
    document.getElementById(id).addEventListener("change", updateDobPreview);
  });
  ["f_name","f_class"].forEach(id=>{
    const el = document.getElementById(id);
    el.addEventListener("input", ()=>{
      const pos = el.selectionStart;
      el.value = el.value.toUpperCase();
      try{ el.setSelectionRange(pos, pos); }catch(e){}
    });
  });
  document.getElementById("f_cccd").addEventListener("input", (e)=>{
    e.target.value = e.target.value.replace(/\D/g,"").slice(0,12);
  });
  document.getElementById("btn_register").onclick = ()=>{
    const name = document.getElementById("f_name").value.trim().toUpperCase();
    const gender = document.getElementById("f_gender").value;
    const d = document.getElementById("f_dob_d").value;
    const m = document.getElementById("f_dob_m").value;
    const y = document.getElementById("f_dob_y").value;
    const cccd = document.getElementById("f_cccd").value.trim();
    const classCode = document.getElementById("f_class").value.trim().toUpperCase();
    const err = document.getElementById("reg_error");
    if(!name || !gender || !d || !m || !y || !/^\d{12}$/.test(cccd) || !classCode){
      err.style.display = "block";
      return;
    }
    err.style.display = "none";
    const dob = `${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    const profile = { name, gender, dob, cccd, classCode, registeredAt: new Date().toISOString() };
    setProfile(profile);
    getProgress(); getMockProgress();
    syncToSheet("register", {});
    render();
  };
}

/* ==========================================================================
   LIST SCREEN (dùng chung cho Chủ đề & Đề thi thử)
   ========================================================================== */
function renderListScreen(kind){
  const dataset = getDataset(kind);
  const progress = kind==="mock" ? getMockProgress() : getProgress();
  const warnings = getWarnings();

  let passedCount=0, totalAttempts=0, sumBest=0, graded=0;
  dataset.forEach(item=>{
    const st = progress[item.id] || {};
    totalAttempts += st.attempts||0;
    if(kind==="topic" && st.status==="passed") passedCount++;
    if(kind==="mock" && (st.bestScore||0) >= PASS_THRESHOLD) passedCount++;
    if(st.attempts>0){ sumBest += st.bestScore||0; graded++; }
  });
  const avgScore = graded>0 ? Math.round((sumBest/graded)*100) : 0;

  let html = `<div class="screen">`;
  html += `
  <div class="stat-strip">
    <div class="stat-chip"><div class="n">${passedCount}/${dataset.length}</div><div class="l">${kind==='mock'?'Đề đạt':'Chủ đề đạt'}</div></div>
    <div class="stat-chip"><div class="n">${avgScore}%</div><div class="l">Điểm TB</div></div>
    <div class="stat-chip"><div class="n">${totalAttempts}</div><div class="l">Lượt làm</div></div>
    <div class="stat-chip"><div class="n" style="color:${warnings.length>0?'var(--danger)':'var(--success)'}">${warnings.length}</div><div class="l">Cảnh báo</div></div>
  </div>`;

  html += `<p class="section-title">${kind==='mock' ? '10 đề thi thử' : '10 chủ đề ôn luyện'}</p>`;

  dataset.forEach((item, idx)=>{
    const st = progress[item.id] || {status: kind==="mock" ? "unlocked" : "locked", bestScore:0, attempts:0, sumScore:0};
    const hasContent = item.questions.length > 0;
    let cardState = "unlocked";
    if(!hasContent) cardState = "empty";
    else if(kind==="topic" && st.status==="locked") cardState = "locked";
    else if(kind==="topic" && st.status==="passed") cardState = "passed";
    else if(kind==="mock" && st.attempts>0 && st.bestScore>=PASS_THRESHOLD) cardState = "passed";

    let icon = "▶️";
    if(cardState==="empty") icon = "🕓";
    else if(cardState==="locked") icon = "🔒";
    else if(cardState==="passed") icon = "✅";

    const best = st.attempts>0 ? Math.round((st.bestScore||0)*100) : null;
    const avg = st.attempts>0 ? Math.round(((st.sumScore||0)/st.attempts)*100) : null;

    let meta1 = hasContent ? `${item.questions.length} câu hỏi` : "Nội dung đang được cập nhật";
    let meta2 = "";
    if(hasContent){
      if(cardState==="locked"){
        meta2 = `<div class="meta2">Hoàn thành chủ đề trước để mở khóa</div>`;
      } else {
        meta2 = `<div class="meta2">
          <span>🏆 Cao nhất: <b>${best!==null? best+'%' : '—'}</b></span>
          <span>🔁 Lượt: <b>${st.attempts||0}</b></span>
          <span>📊 TB: <b>${avg!==null? avg+'%' : '—'}</b></span>
        </div>`;
      }
    }

    html += `
    <div class="topic-card ${cardState}" data-kind="${kind}" data-id="${item.id}">
      <div class="topic-badge">${idx+1}</div>
      <div class="topic-info">
        <p class="name">${escapeHtml(item.name)}</p>
        <p class="meta1">${meta1}</p>
        ${meta2}
      </div>
      <div class="topic-status">${icon}</div>
    </div>`;
  });

  html += `</div>`;
  return html;
}

function bindMainEvents(){
  document.querySelectorAll(".tab").forEach(el=>{ el.onclick = ()=>{ state.activeTab = el.dataset.tab; render(); }; });
  const logoutBtn = document.getElementById("btn_logout"); if(logoutBtn) logoutBtn.onclick = showLogoutConfirm;
  document.querySelectorAll(".topic-card[data-id]").forEach(el=>{
    el.onclick = ()=>{
      const kind = el.dataset.kind;
      const id = parseInt(el.dataset.id, 10);
      const dataset = getDataset(kind);
      const item = dataset.find(x=>x.id===id);
      if(!item || item.questions.length===0) return;
      if(kind==="topic"){
        const progress = getProgress();
        const st = progress[id];
        if(!st || st.status==="locked") return;
      }
      startQuiz(kind, id);
    };
  });
}

function showLogoutConfirm(){
  const div = document.createElement("div");
  div.className = "modal-backdrop";
  div.innerHTML = `
    <div class="modal-box">
      <div class="micon">🚪</div>
      <h3>Đăng ký lại với lớp mới?</h3>
      <p>Toàn bộ thông tin và tiến trình ôn luyện hiện tại trên thiết bị này (điểm số, lượt làm bài, cảnh báo) sẽ bị <b>xóa vĩnh viễn</b> để bạn đăng ký lại với mã lớp mới. Bạn có chắc chắn muốn tiếp tục không?</p>
      <div class="modal-actions">
        <button class="btn secondary" id="modal_logout_cancel">HỦY BỎ</button>
        <button class="btn" style="background:var(--danger)" id="modal_logout_confirm">XÁC NHẬN</button>
      </div>
    </div>`;
  document.body.appendChild(div);
  document.getElementById("modal_logout_cancel").onclick = ()=> div.remove();
  document.getElementById("modal_logout_confirm").onclick = ()=>{
    localStorage.removeItem(LS_PROFILE);
    localStorage.removeItem(LS_PROGRESS);
    localStorage.removeItem(LS_MOCK_PROGRESS);
    localStorage.removeItem(LS_WARNINGS);
    div.remove();
    state = { screen:"loading", activeTab:"topics", quizKind:null, currentItemId:null, quiz:null, lastResult:null };
    render();
  };
}


/* ==========================================================================
   QUIZ ENGINE (dạng trượt kéo lên xuống — trả lời hết rồi mới nộp bài)
   ========================================================================== */
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

function startQuiz(kind, id){
  const dataset = getDataset(kind);
  const item = dataset.find(x=>x.id===id);
  // Chủ đề ôn tập: giữ nguyên thứ tự câu hỏi (không đảo).
  // Đề thi thử: đảo thứ tự câu hỏi (đáp án trong mỗi câu luôn giữ nguyên thứ tự ở cả 2 loại).
  const baseOrder = item.questions.map((_,i)=>i);
  const order = kind==="mock" ? shuffle(baseOrder) : baseOrder;
  const totalSeconds = EXAM_MINUTES * 60;
  state.quizKind = kind;
  state.currentItemId = id;
  state.quiz = { order, answers: new Array(order.length).fill(null), secondsLeft: totalSeconds, timerHandle:null, warningCount:0 };
  state.screen = "quiz";
  startAntiCheat();
  render();
  startTimer();
}

function startTimer(){
  if(state.quiz.timerHandle) clearInterval(state.quiz.timerHandle);
  state.quiz.timerHandle = setInterval(()=>{
    if(!state.quiz) return;
    state.quiz.secondsLeft--;
    const timerEl = document.getElementById("quizTimer");
    if(timerEl){
      const mm = String(Math.floor(Math.max(0,state.quiz.secondsLeft)/60)).padStart(2,"0");
      const ss = String(Math.max(0,state.quiz.secondsLeft)%60).padStart(2,"0");
      timerEl.textContent = "⏱ " + mm + ":" + ss;
    }
    if(state.quiz.secondsLeft<=0){
      clearInterval(state.quiz.timerHandle);
      finishQuiz(true);
    }
  }, 1000);
}

function renderQuizPage(){
  const item = getDataset(state.quizKind).find(x=>x.id===state.currentItemId);
  const q = state.quiz;
  const mm = String(Math.floor(q.secondsLeft/60)).padStart(2,"0");
  const ss = String(q.secondsLeft%60).padStart(2,"0");

  let slidesHtml = "";
  q.order.forEach((qIndex, i)=>{
    const question = item.questions[qIndex];
    let optsHtml = "";
    question.options.forEach((opt, oi)=>{
      const dotLabel = String.fromCharCode(65+oi);
      optsHtml += `<div class="opt" data-slide="${i}" data-opt="${oi}"><div class="dot">${dotLabel}</div><div>${escapeHtml(opt)}</div></div>`;
    });
    slidesHtml += `
    <section class="qslide" data-idx="${i}">
      <div class="qnum">Câu ${i+1}/${q.order.length}</div>
      <div class="qcard">
        <p class="qtext">${escapeHtml(question.q)}</p>
        <div>${optsHtml}</div>
      </div>
    </section>`;
  });
  slidesHtml += `
  <section class="qslide submit-slide" data-idx="${q.order.length}">
    <div class="icon">🎯</div>
    <h3>Bạn đã hoàn thành tất cả câu hỏi</h3>
    <p>Kiểm tra lại nếu cần, sau đó bấm Nộp bài để xem kết quả và giải thích chi tiết.</p>
  </section>`;

  return `
  <div class="quiz-page">
    <div class="quiz-header">
      <div class="quiz-header-row">
        <button class="exit-btn" id="btn_exit">THOÁT</button>
        <div class="quiz-title">${escapeHtml(item.name)}</div>
        <div class="timer" id="quizTimer">⏱ ${mm}:${ss}</div>
      </div>
      <div class="quiz-progress-track"><div class="quiz-progress-fill" id="quizProgressFill" style="width:0%"></div></div>
    </div>
    <div class="quiz-scroll" id="quizScroll">${slidesHtml}</div>
    <div class="quiz-footer">
      <div class="answered-count" id="answeredCount">Đã trả lời: 0/${q.order.length}</div>
      <button class="btn" id="btn_submit" disabled>Nộp bài</button>
    </div>
  </div>`;
}

function bindQuizEvents(){
  const item = getDataset(state.quizKind).find(x=>x.id===state.currentItemId);
  const q = state.quiz;
  const scrollEl = document.getElementById("quizScroll");
  const answeredCountEl = document.getElementById("answeredCount");
  const submitBtn = document.getElementById("btn_submit");
  const progressFill = document.getElementById("quizProgressFill");

  function refreshAnsweredUI(){
    const answered = q.answers.filter(a=>a!==null).length;
    answeredCountEl.textContent = `Đã trả lời: ${answered}/${q.order.length}`;
    submitBtn.disabled = answered < q.order.length;
  }
  refreshAnsweredUI();

  scrollEl.querySelectorAll(".opt").forEach(el=>{
    el.addEventListener("click", ()=>{
      const slideIdx = parseInt(el.dataset.slide,10);
      const optIdx = parseInt(el.dataset.opt,10);
      q.answers[slideIdx] = optIdx;
      scrollEl.querySelectorAll(`.opt[data-slide="${slideIdx}"]`).forEach(o=>o.classList.remove("selected"));
      el.classList.add("selected");
      refreshAnsweredUI();
      // Tự động đẩy lên câu tiếp theo sau khi chọn đáp án (chỉ tiến tới, không tự lùi lại).
      const nextSlide = scrollEl.querySelector(`.qslide[data-idx="${slideIdx+1}"]`);
      if(nextSlide){
        setTimeout(()=>{ nextSlide.scrollIntoView({behavior:"smooth", block:"start"}); }, 320);
      }
    });
  });

  scrollEl.addEventListener("scroll", ()=>{
    const pct = Math.min(100, Math.round((scrollEl.scrollTop / (scrollEl.scrollHeight - scrollEl.clientHeight || 1)) * 100));
    progressFill.style.width = pct + "%";
  });

  document.getElementById("btn_exit").onclick = showExitConfirm;
  submitBtn.onclick = ()=>{ if(!submitBtn.disabled) finishQuiz(false); };
}

function showExitConfirm(){
  const div = document.createElement("div");
  div.className = "modal-backdrop";
  div.innerHTML = `
    <div class="modal-box">
      <div class="micon">⚠️</div>
      <h3>Thoát khỏi bài làm?</h3>
      <p>Kết quả sẽ <b>không được ghi nhận</b> nếu bạn thoát bây giờ. Bạn có chắc chắn muốn thoát không?</p>
      <div class="modal-actions">
        <button class="btn secondary" id="modal_cancel">HỦY BỎ</button>
        <button class="btn" style="background:var(--danger)" id="modal_confirm">XÁC NHẬN</button>
      </div>
    </div>`;
  document.body.appendChild(div);
  document.getElementById("modal_cancel").onclick = ()=> div.remove();
  document.getElementById("modal_confirm").onclick = ()=>{
    div.remove();
    exitQuizWithoutSaving();
  };
}

function exitQuizWithoutSaving(){
  if(state.quiz && state.quiz.timerHandle) clearInterval(state.quiz.timerHandle);
  stopAntiCheat();
  state.quiz = null;
  state.screen = null;
  render();
}

function finishQuiz(timeUp){
  const kind = state.quizKind;
  const item = getDataset(kind).find(x=>x.id===state.currentItemId);
  const q = state.quiz;
  if(q.timerHandle) clearInterval(q.timerHandle);
  stopAntiCheat();

  let correct = 0;
  const reviewItems = [];
  q.order.forEach((qIndex, i)=>{
    const question = item.questions[qIndex];
    const ans = q.answers[i];
    const isCorrect = ans === question.answer;
    if(isCorrect) correct++;
    reviewItems.push({ q:question.q, options:question.options, answer:question.answer, chosen:ans, explain:question.explain, isCorrect });
  });
  const total = item.questions.length;
  const score = total>0 ? correct/total : 0;
  const passed = score >= PASS_THRESHOLD;

  if(kind==="topic"){
    const progress = getProgress();
    const st = progress[item.id] || {status:"unlocked", bestScore:0, attempts:0, sumScore:0};
    st.attempts = (st.attempts||0)+1;
    st.sumScore = (st.sumScore||0)+score;
    st.bestScore = Math.max(st.bestScore||0, score);
    if(passed) st.status = "passed"; else if(st.status!=="passed") st.status = "unlocked";
    progress[item.id] = st;
    if(passed){
      const idx = TOPICS_DATA.findIndex(t=>t.id===item.id);
      const nextTopic = TOPICS_DATA[idx+1];
      if(nextTopic){
        const nst = progress[nextTopic.id] || {status:"locked", bestScore:0, attempts:0, sumScore:0};
        if(nst.status==="locked") nst.status = "unlocked";
        progress[nextTopic.id] = nst;
      }
    }
    setProgress(progress);
  } else {
    const mp = getMockProgress();
    const st = mp[item.id] || {bestScore:0, attempts:0, sumScore:0};
    st.attempts = (st.attempts||0)+1;
    st.sumScore = (st.sumScore||0)+score;
    st.bestScore = Math.max(st.bestScore||0, score);
    mp[item.id] = st;
    setMockProgress(mp);
  }

  syncToSheet("quiz_result", { kind, itemId:item.id, itemName:item.name, score, correct, total, passed, timeUp, warnings:q.warningCount||0 });

  state.lastResult = { item, kind, score, correct, total, passed, timeUp, reviewItems };
  state.quiz = null;
  state.screen = "result";
  render();
}

function renderResultScreen(){
  const r = state.lastResult;
  const pct = Math.round(r.score*100);
  const backLabel = r.kind==="mock" ? "Quay lại Đề thi thử" : "Quay lại Chủ đề ôn tập";
  let html = `<div class="screen">`;
  html += `
    <div class="result-hero">
      <p class="result-item-name">${escapeHtml(r.item.name)}</p>
      <div class="result-ring ${r.passed?'pass':'fail'}" style="--pct:${pct}"><div class="inner">${pct}%</div></div>
      <p class="result-title">${r.passed ? "🎉 Đạt yêu cầu!" : "Chưa đạt 80%"}</p>
      <p class="result-sub">Đúng ${r.correct}/${r.total} câu ${r.timeUp?"· Hết giờ làm bài":""}${r.kind==='topic' && r.passed ? " · Chủ đề tiếp theo đã được mở khóa" : ""}</p>
      <button class="btn secondary btn-backlist" style="margin-bottom:10px;">${backLabel}</button>
    </div>
    <p class="section-title">Xem lại bài làm</p>`;
  r.reviewItems.forEach((it, idx)=>{
    html += `
    <div class="review-item">
      <span class="review-tag ${it.isCorrect?'ok':'bad'}">${it.isCorrect ? "Đúng":"Sai"}</span>
      <p class="review-q">Câu ${idx+1}: ${escapeHtml(it.q)}</p>
      <div style="font-size:13px;color:var(--ink-soft);margin-bottom:6px;">
        Đáp án đúng: <b style="color:var(--success)">${escapeHtml(it.options[it.answer])}</b>
        ${!it.isCorrect && it.chosen!==null ? `<br>Bạn chọn: <b style="color:var(--danger)">${escapeHtml(it.options[it.chosen])}</b>` : ""}
        ${it.chosen===null ? `<br><i>Chưa trả lời</i>` : ""}
      </div>
      <div class="explain-box"><b>Giải thích:</b> ${escapeHtml(it.explain)}</div>
    </div>`;
  });
  html += `<button class="btn btn-backlist" style="margin-top:6px;">${backLabel}</button>`;
  html += `</div>`;
  return html;
}
function bindResultEvents(){
  document.querySelectorAll(".btn-backlist").forEach(btn=>{
    btn.onclick = ()=>{
      state.activeTab = state.lastResult.kind==="mock" ? "mocks" : "topics";
      state.screen = null; state.lastResult = null;
      render();
    };
  });
}

/* ==========================================================================
   ANTI-CHEAT
   ========================================================================== */
let _hiddenSince = null;
function onVisibilityChange(){
  if(document.hidden){ _hiddenSince = Date.now(); }
  else if(_hiddenSince){
    const awaySeconds = Math.round((Date.now()-_hiddenSince)/1000);
    _hiddenSince = null;
    if(awaySeconds>=2 && state.quiz) registerCheatWarning(awaySeconds);
  }
}
function registerCheatWarning(awaySeconds){
  if(!state.quiz) return;
  state.quiz.warningCount = (state.quiz.warningCount||0)+1;
  const item = getDataset(state.quizKind).find(x=>x.id===state.currentItemId);
  addWarning({ itemKind: state.quizKind, itemId: state.currentItemId, itemName: item?item.name:"", timestamp:new Date().toISOString(), awaySeconds });
  showWarningBanner(awaySeconds);
}
function showWarningBanner(awaySeconds){
  const old = document.querySelector(".warn-banner"); if(old) old.remove();
  const b = document.createElement("div");
  b.className = "warn-banner";
  b.textContent = `CẢNH BÁO — Bạn vừa thoát ra màn hình ứng dụng (${awaySeconds}s) — hành động này đã được ghi nhận`;
  document.body.appendChild(b);
  setTimeout(()=>b.remove(), 4000);
}
function startAntiCheat(){ document.addEventListener("visibilitychange", onVisibilityChange); }
function stopAntiCheat(){ document.removeEventListener("visibilitychange", onVisibilityChange); }

/* ==========================================================================
   UTIL
   ========================================================================== */
function escapeHtml(str){
  if(str===undefined||str===null) return "";
  return String(str).replace(/[&<>"']/g, s=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[s]));
}

render();
</script>
